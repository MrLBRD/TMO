name: Build TMO Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0 libdmtx0t64 libglib2.0-0 libgl1

      - name: Install Python dependencies (lock haché)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Audit dependencies (pip-audit, bloquant)
        run: pip-audit -r requirements.txt --require-hashes --disable-pip

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (lock haché, pip et PyInstaller compris)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller TMO.spec

      - name: Smoke test EXE (imports critiques)
        run: dist\TMO.exe --smoke-test

      - name: Build installer with Inno Setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Generate SHA256
        run: |
          $hash = Get-FileHash dist/TMO_Setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  TMO_Setup.exe" | Out-File -FilePath dist/TMO_Setup.exe.sha256 -Encoding ASCII -NoNewline

      - name: Sign SHA256 (ed25519)
        # Échoue si le secret manque ou ne correspond pas à la clé publique
        # embarquée (core/updater.py) : aucune release ne part sans .sig valide.
        env:
          TMO_SIGNING_KEY: ${{ secrets.TMO_SIGNING_KEY }}
        run: python release_signing.py sign dist/TMO_Setup.exe.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TMO_Setup
          path: |
            dist/TMO_Setup.exe
            dist/TMO_Setup.exe.sha256
            dist/TMO_Setup.exe.sha256.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TMO_Setup
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/TMO_Setup.exe
            dist/TMO_Setup.exe.sha256
            dist/TMO_Setup.exe.sha256.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
